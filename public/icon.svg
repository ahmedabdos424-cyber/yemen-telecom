<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#7f1d1d" stroke-width="4"/>
  <!-- SIM Card body -->
  <rect x="106" y="136" width="300" height="260" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
  <!-- SIM cut corner (top-left notch) -->
  <path d="M130 160 L160 130 L160 136 L406 136 L406 376 L130 376 Z" fill="#1e293b"/>
  <path d="M130 160 L160 130 L160 136 L130 166 Z" fill="#0f172a"/>
  <!-- Contact pads -->
  <rect x="156" y="180" width="80" height="36" rx="6" fill="url(#pad)" opacity="0.9"/>
  <rect x="156" y="230" width="80" height="36" rx="6" fill="url(#pad)" opacity="0.8"/>
  <rect x="156" y="280" width="80" height="36" rx="6" fill="url(#pad)" opacity="0.7"/>
  <rect x="156" y="330" width="80" height="36" rx="6" fill="url(#pad)" opacity="0.6"/>
  <!-- Second column pads -->
  <rect x="254" y="180" width="60" height="36" rx="6" fill="url(#pad)" opacity="0.9"/>
  <rect x="254" y="230" width="60" height="36" rx="6" fill="url(#pad)" opacity="0.8"/>
  <rect x="254" y="280" width="60" height="36" rx="6" fill="url(#pad)" opacity="0.7"/>
  <rect x="254" y="330" width="60" height="36" rx="6" fill="url(#pad)" opacity="0.6"/>
  <!-- SIM Chip / Microcontroller -->
  <rect x="340" y="180" width="40" height="40" rx="4" fill="url(#chip)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Signal tower icon -->
  <g transform="translate(346, 248)">
    <rect x="14" y="0" width="4" height="44" rx="2" fill="#475569"/>
    <path d="M0 12 Q16 0 32 12" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 20 Q16 10 27 20" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 28 Q16 20 22 28" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- SIM Card text -->
  <text x="360" y="344" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">SIM</text>
  <!-- Brand text -->
  <text x="256" y="420" font-family="sans-serif" font-size="36" font-weight="bold" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">يمن تليكوم</text>
  <!-- Subtitle line -->
  <line x1="180" y1="438" x2="332" y2="438" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Yemen outline decoration -->
  <path d="M216 452 Q256 442 296 452" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
