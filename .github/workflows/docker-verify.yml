name: Docker Verification

on:
  push:
    branches: [main, docker-verify]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yemen-telecom:test .

      - name: Start container and test
        run: |
          docker run -d --name yt-test -p 4000:4000 \
            -e NODE_ENV=production \
            -e API_PORT=4000 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_USER=test \
            -e DB_PASSWORD=test \
            -e DB_NAME=test \
            -e DB_SSL_REJECT_UNAUTHORIZED=false \
            -e DB_FAMILY=4 \
            -e DB_MAX_CONNECTIONS=5 \
            -e DB_SLOW_QUERY_MS=1000 \
            -e JWT_SECRET=test-jwt-secret-for-verify-at-least-32-chars \
            -e REFRESH_SECRET=test-refresh-secret-for-verify-at-least-32 \
            -e CSRF_SECRET=test-csrf-secret-for-verify-at-least-32-chars \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e FIREBASE_PROJECT_ID=test \
            -e FIREBASE_PRIVATE_KEY=test \
            -e FIREBASE_CLIENT_EMAIL=test@test.com \
            -e FIREBASE_STORAGE_BUCKET=test.appspot.com \
            yemen-telecom:test
          echo "Waiting for container health..."
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Container healthy after ${i}s"
              break
            fi
            sleep 2
          done
          echo "=== CONTAINER LOGS ==="
          docker logs yt-test 2>&1
          echo "=== CHECK PROCESS STARTED ==="
          docker ps --filter name=yt-test --format "Container {{.Names}} is {{.Status}}"
          echo "=== HEALTH CHECK ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health || echo "000")
          echo "Health check HTTP: $HTTP_CODE"
          echo "=== FRONTEND ==="
          HTTP_FE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/ || echo "000")
          echo "Frontend HTTP: $HTTP_FE"
          FRONTEND_TITLE=$(curl -s http://localhost:4000/ | grep -o '<title>[^<]*</title>' || echo "(no title)")
          echo "Frontend title: $FRONTEND_TITLE"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: yemen-telecom:test
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Cleanup
        if: always()
        run: |
          docker stop yt-test 2>/dev/null || true
          docker rm yt-test 2>/dev/null || true
