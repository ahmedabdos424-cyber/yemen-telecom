name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Lint, TypeScript, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit --skipLibCheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Create Sentry release & upload source maps
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mliki-technique
          SENTRY_PROJECT: yemen-telecom-api
          SENTRY_RELEASE: ${{ github.sha }}
        with:
          environment: production
          sourcemaps: dist/assets
          url_prefix: ~/assets

  test:
    name: Tests (Frontend + Backend + Security)
    needs: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yemen_telecom_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-ci-at-least-32-chars-long
      CSRF_SECRET: test-csrf-secret-for-ci-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run all tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets in source
        run: |
          ! grep -r -E '(-----BEGIN RSA PRIVATE KEY-----|-----BEGIN OPENSSH PRIVATE KEY-----)' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' . 2>/dev/null | grep -v node_modules | grep -v '.github/'
