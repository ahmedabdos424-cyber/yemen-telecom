name: Docker Verification

on:
  push:
    branches: [docker-verify]

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify host info
        run: |
          echo "=== HOST INFO ==="
          uname -a
          docker --version
          node --version
          npm --version
          echo "=== NPM CI ON LINUX HOST ==="
          npm ci 2>&1 | tee /tmp/npm-ci.log
          echo "=== FRONTEND BUILD ==="
          npm run build 2>&1 | tee /tmp/frontend-build.log
          echo "=== SERVER BUILD ==="
          cd server && npm ci 2>&1 | tee /tmp/server-npm-ci.log
          cd server && npx tsc --noEmit --skipLibCheck 2>&1 | tee /tmp/tsc.log

      - name: Build Docker image
        run: |
          docker build -t yemen-telecom:test . 2>&1 | tee /tmp/docker-build.log
          echo "DOCKER_BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Check Docker build result
        if: failure()
        run: |
          echo "=== DOCKER BUILD FAILED ==="
          cat /tmp/docker-build.log 2>/dev/null || echo "(no log)"
          echo "=== NPM CI LOG ==="
          cat /tmp/npm-ci.log 2>/dev/null || echo "(no log)"
          echo "=== FRONTEND BUILD LOG ==="
          cat /tmp/frontend-build.log 2>/dev/null || echo "(no log)"
          exit 1

      - name: Start container
        run: |
          echo "=== DOCKER BUILD SUCCEEDED ==="
          head -5 /tmp/docker-build.log
          docker run -d --name yt-test -p 4000:4000 \
            -e NODE_ENV=production \
            -e API_PORT=4000 \
            -e DB_HOST=dpg-cv5rc8q4d50c73d4krp0-a.oregon-postgres.render.com \
            -e DB_PORT=5432 \
            -e DB_USER=dummy \
            -e DB_PASSWORD=dummy \
            -e DB_NAME=dummy \
            -e DB_SSL_REJECT_UNAUTHORIZED=false \
            -e DB_FAMILY=4 \
            -e DB_MAX_CONNECTIONS=5 \
            -e DB_SLOW_QUERY_MS=1000 \
            -e JWT_SECRET=test-jwt-secret-for-verify-at-least-32-chars \
            -e REFRESH_SECRET=test-refresh-secret-for-verify-at-least-32 \
            -e CSRF_SECRET=test-csrf-secret-for-verify-at-least-32-chars \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e FIREBASE_PROJECT_ID=test \
            -e FIREBASE_PRIVATE_KEY=test \
            -e FIREBASE_CLIENT_EMAIL=test@test.com \
            -e FIREBASE_STORAGE_BUCKET=test.appspot.com \
            yemen-telecom:test
          sleep 8
          echo "=== CONTAINER LOGS ==="
          docker logs yt-test 2>&1 || true
          echo "=== HEALTH CHECK ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:4000/api/health || echo "Health check failed"
          curl -s http://localhost:4000/api/health || echo "(empty)"
          echo "=== FRONTEND ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:4000/ || echo "Frontend check failed"
          curl -s http://localhost:4000/ | grep -o '<title>[^<]*</title>' || echo "(no title)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/*.log

      - name: Cleanup
        if: always()
        run: |
          docker stop yt-test 2>/dev/null || true
          docker rm yt-test 2>/dev/null || true
