name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install server dependencies
        run: cd server && npm ci
      - run: npm run build
        name: Frontend Build
      - run: cd server && npx tsc --skipLibCheck
        name: Server Build
