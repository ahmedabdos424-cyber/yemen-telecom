services:
  - type: keyvalue
    name: yemen-telecom-kv
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: yemen-telecom
    env: docker
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          name: yemen-telecom-kv
          type: keyvalue
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA_CERT
        sync: false
      - key: DB_MAX_CONNECTIONS
        value: "20"
      - key: DB_MIN_CONNECTIONS
        value: "3"
      - key: DB_SLOW_QUERY_MS
        value: "500"
      - key: DB_FAMILY
        value: "4"
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: BLACKLIST_HMAC_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: UPLOAD_BUCKET
        value: uploads
      # External backup storage (S3-compatible)
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      # Sentry error tracking (DSN is public — not a secret)
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      # APK self-update metadata (consumed by GET /api/app-version).
      # These MUST stay in sync with android/app/build.gradle (versionName / versionCode)
      # and with server/.env.example. A mismatch silently breaks the updater (rule #2).
      - key: APP_VERSION
        value: "1.1.0"
      - key: APP_VERSION_CODE
        value: "24"
      - key: APP_APK_BUCKET
        value: "uploads"
      - key: APP_APK_OBJECT
        value: "releases/app-1.1.0.apk"
      - key: APP_APK_URL
        value: ""
      - key: APP_APK_SHA256
        value: "4BFAF60F27BA467C156F1ADA34CA9316B3B42040E7D6A1C7D5ADE76FBC468D4A"
      - key: APP_APK_SIZE
        value: "30054105"
      - key: APP_UPDATE_NOTES
        value: "فحص أمني شامل — 22 إصلاح|تحسينات RBAC وصلاحيات الأدوار|إصلاحات أداء Race Conditions وTOCTOU|تحسينات Schema وتنقيح قاعدة البيانات"
      - key: APP_UPDATE_REQUIRED
        value: "false"
