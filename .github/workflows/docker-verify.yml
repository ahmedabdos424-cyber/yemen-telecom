name: Docker Verification

on:
  push:
    branches: [docker-verify]

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yt_verify
          POSTGRES_PASSWORD: yt_verify_local_only_pw
          POSTGRES_DB: yt_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify host info
        run: |
          echo "=== HOST INFO ==="
          uname -a
          docker --version
          node --version
          npm --version

      - name: Build Docker image
        run: docker build -t yemen-telecom:test . 2>&1

      - name: Verify npm ci on Linux
        run: |
          echo "=== NPM CI ==="
          npm ci 2>&1
          echo "=== FRONTEND BUILD ==="
          npm run build 2>&1
          echo "=== SERVER BUILD ==="
          cd server && npm ci 2>&1
          npx tsc --noEmit --skipLibCheck 2>&1

      - name: Start container and test
        run: |
          # --network host lets the container reach the service Postgres via
          # localhost, which also keeps DB_SSL enforcement local-safe
          # (db.ts disables SSL only for localhost/127.0.0.1).
          docker run -d --network host --name yt-test \
            -e NODE_ENV=production \
            -e API_PORT=4000 \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=yt_verify \
            -e DB_PASSWORD=yt_verify_local_only_pw \
            -e DB_NAME=yt_verify \
            -e DB_SSL_REJECT_UNAUTHORIZED=true \
            -e DB_FAMILY=4 \
            -e DB_MAX_CONNECTIONS=5 \
            -e DB_SLOW_QUERY_MS=1000 \
            -e JWT_SECRET=test-jwt-secret-for-verify-at-least-32-chars \
            -e REFRESH_SECRET=test-refresh-secret-for-verify-at-least-32 \
            -e CSRF_SECRET=test-csrf-secret-for-verify-at-least-32-chars \
            -e BLACKLIST_HMAC_SECRET=test-blacklist-secret-for-verify-32-chars \
            -e CORS_ORIGIN=http://localhost:3000 \
            yemen-telecom:test
          sleep 8
          echo "=== CONTAINER LOGS ==="
          docker logs yt-test 2>&1 || true
          echo "=== HEALTH CHECK ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:4000/api/health || echo "Health check failed"
          curl -s http://localhost:4000/api/health || echo "(empty)"
          echo "=== FRONTEND ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:4000/ || echo "Frontend check failed"
          curl -s http://localhost:4000/ | grep -o '<title>[^<]*</title>' || echo "(no title)"

      - name: Cleanup
        if: always()
        run: |
          docker stop yt-test 2>/dev/null || true
          docker rm yt-test 2>/dev/null || true
