name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Lint, TypeScript, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit --skipLibCheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Create Sentry release & upload source maps
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mliki-technique
          SENTRY_PROJECT: javascript-react
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npx --yes @sentry/cli releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli sourcemaps upload dist/assets --release "$SENTRY_RELEASE" --url-prefix ~/assets
          npx --yes @sentry/cli releases set-commits "$SENTRY_RELEASE" --auto
          npx --yes @sentry/cli releases finalize "$SENTRY_RELEASE"

  test:
    name: Tests (Frontend + Backend + Security)
    needs: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yemen_telecom_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-ci-at-least-32-chars-long
      CSRF_SECRET: test-csrf-secret-for-ci-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run all tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E (Playwright — activation flow)
    needs: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: yemen_telecom_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-ci-at-least-32-chars-long
      CSRF_SECRET: test-csrf-secret-for-ci-at-least-32-chars-long
      BLACKLIST_HMAC_SECRET: test-blacklist-hmac-secret-for-ci
      SEED_PASSWORD_MANAGER: Password123
      E2E_USERNAME: manager
      E2E_PASSWORD: Password123
      E2E_BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if node -e "const n=require('net');const s=n.connect(5432,'127.0.0.1');s.on('connect',()=>{console.log('postgres ready');process.exit(0)});s.on('error',()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Initialize database (schema + migrations)
        run: |
          set -o pipefail
          npx tsx server/src/init-db.ts 2>&1 | tee /tmp/initdb.log

      - name: Upload init-db diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: initdb-log
          path: /tmp/initdb.log
          retention-days: 7
          if-no-files-found: warn

      - name: Publish init-db diagnostics to ntfy.sh
        if: failure()
        run: |
          curl -d "$(< /tmp/initdb.log)" "https://ntfy.sh/YemenTelecomCIDiagnosticsInitDBLog_${{ github.sha }}"

      - name: Seed demo passwords
        run: npx tsx server/src/seed.ts

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build frontend
        run: npm run build

      - name: Start API server
        run: |
          API_PORT=4000 node server/dist/index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "API ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:4000/api/health

      - name: Start frontend preview (proxy → local API)
        run: |
          VITE_PROXY_TARGET=http://localhost:4000 npx vite preview --port 4173 --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173 > /dev/null 2>&1; then
              echo "Preview ready"
              break
            fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts --project="Desktop Chrome"
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets in source
        run: |
          ! grep -r -E '(-----BEGIN RSA PRIVATE KEY-----|-----BEGIN OPENSSH PRIVATE KEY-----)' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' . 2>/dev/null | grep -v node_modules | grep -v '.github/'
