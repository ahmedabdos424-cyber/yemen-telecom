name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Lint, TypeScript, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit --skipLibCheck

      - name: Build frontend
        run: npm run build

      - name: Build server
        working-directory: server
        run: npm run build

  test:
    name: Tests (Frontend + Backend + Security)
    needs: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yemen_telecom_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-ci-at-least-32-chars-long
      CSRF_SECRET: test-csrf-secret-for-ci-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run all tests with coverage
        run: npx vitest run --reporter=verbose --coverage
        env:
          CI: true

      - name: Check minimum coverage threshold
        run: |
          npx vitest run --coverage --reporter=json 2>/dev/null | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              try{const r=JSON.parse(d);const b=r.total?.branches?.pct??0;const l=r.total?.lines?.pct??0;console.log('Branches:',b,'% Lines:',l,'%');if(b<50||l<50){console.error('FAIL: Coverage below 50% threshold');process.exit(1)}else{console.log('PASS: Coverage above 50% threshold')}
              }catch(e){console.error('FAIL: Could not parse coverage report');process.exit(1)}
            })
          "
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: npm audit (server)
        working-directory: server
        run: npm audit --audit-level=moderate

      - name: Check for secrets in source
        run: |
          ! grep -r -E '(-----BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY-----|ghp_|ghs_|gho_|ghu_|ghr_|AKIA[0-9A-Z]{16}|sk_live_|sk_test_|rk_live_|rk_test_)' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sql' . 2>/dev/null | grep -v node_modules | grep -v '.github/' | grep -v 'test-' | grep -v 'test_jwt'

      - name: Pagination audit (no unbounded SELECT)
        run: npx tsx scripts/pagination-audit.ts

      - name: Math.random() audit (business logic)
        run: |
          if grep -rl "Math.random()" server/src/routes/ server/src/middleware/ 2>/dev/null; then
            echo "❌ Math.random() found in business logic — use crypto.randomInt() instead"
            exit 1
          fi
          echo "✅ No Math.random() in business logic"

  load-test:
    name: Load Test (k6)
    needs: [test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: yemen_telecom_test
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      JWT_SECRET: test-jwt-secret-for-load-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-load-at-least-32-chars
      CSRF_SECRET: test-csrf-secret-for-load-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Start backend
        run: |
          npx tsx server/src/index.ts &
          for i in $(seq 1 15); do
            if curl -s http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Run load test
        run: k6 run qa-tests/load-test.js --env BASE_URL=http://localhost:4000

  e2e:
    name: E2E Tests (Playwright)
    needs: [test, lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yemen_telecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: yemen_telecom_test
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      JWT_SECRET: test-jwt-secret-for-e2e-at-least-32-chars-long
      REFRESH_SECRET: test-refresh-secret-for-e2e-at-least-32-chars
      CSRF_SECRET: test-csrf-secret-for-e2e-at-least-32-chars
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install all dependencies
        run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          npx tsx server/src/index.ts &
          for i in $(seq 1 15); do
            if curl -s http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Start frontend preview
        run: |
          npx vite preview --port 3000 &
          for i in $(seq 1 10); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ | grep -q '200\|304'; then
              echo "Frontend ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Run E2E tests
        run: npx playwright test qa-tests/e2e-final-certification.spec.cjs
        timeout-minutes: 10
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-report/
          retention-days: 7

  testsprite:
    name: TestSprite E2E (Deployed)
    needs: [test, lint, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      - name: Configure TestSprite
        run: testsprite setup --from-env --yes
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

      - name: Run TestSprite tests against deployed app
        run: |
          testsprite test run --all --project ae188b56-e8c8-47ae-98f0-bb0d01f6b385 \
            --target-url https://yementelecom1.netlify.app \
            --wait --timeout 600 || true
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

      - name: Verify TestSprite results
        run: |
          testsprite test list --project ae188b56-e8c8-47ae-98f0-bb0d01f6b385 --output json | \
            node -e "
              let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
                try {
                  const r = JSON.parse(d);
                  const passed = r.items.filter(t => t.status === 'passed').length;
                  const failed = r.items.filter(t => t.status === 'failed').length;
                  console.log('TestSprite: ' + passed + ' passed, ' + failed + ' failed, ' + r.items.length + ' total');
                  if (failed > 0) { console.error('FAIL'); process.exit(1); }
                  console.log('PASS');
                } catch(e) { console.error('Parse error'); process.exit(1); }
              })
            "
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

      - name: Upload TestSprite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-ci-results
          path: .testsprite/
          retention-days: 7
